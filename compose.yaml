services:
  mlflow:
    build: .
    container_name: q2-mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5001
      --backend-store-uri sqlite:////mlflow-data/mlflow.db
      --artifacts-destination /mlflow-data/artifacts
      --allowed-hosts "*"
    ports:
      - "5001:5001"
    volumes:
      - ./mlflow-data:/mlflow-data
    restart: unless-stopped

  app:
    build: .
    container_name: q2-ml-api
    command: python app.py
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5001
      MODEL_URI: models:/IrisRandomForest/2
    ports:
      - "8000:8000"
    depends_on:
      - mlflow
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: q2-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: q2-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  grafana-data:
